# =====================================================================
# CẤU HÌNH KẾT NỐI CSDL (JDBC: MySQL / SQL Server) & GIAO THỨC TCP/IP
# =====================================================================

# Chọn loại CSDL ưu tiên: mysql | sqlserver | h2
db.type=mysql

# --- Cấu hình MySQL ---
mysql.url=jdbc:mysql://localhost:3306/quan_ly_cong_nhan?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
mysql.user=root
mysql.password=123456

# --- Cấu hình SQL Server (nếu đổi db.type=sqlserver) ---
sqlserver.url=jdbc:sqlserver://localhost:1433;databaseName=quan_ly_cong_nhan;encrypt=true;trustServerCertificate=true
sqlserver.user=sa
sqlserver.password=123456

# --- Tự động chuyển sang CSDL JDBC nhúng (file ./data/quan_ly_cong_nhan) nếu MySQL/SQL Server chưa bật ---
db.autoFallback=true

# --- Cấu hình TCP/IP Socket Server & Web Client ---
tcp.host=127.0.0.1
tcp.port=9090
web.port=8080
